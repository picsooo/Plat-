<!DOCTYPE html><html lang="fr"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#0b0b0c">


<link rel="stylesheet" href="style.css"><link rel="icon" href="img/logo.png">
<title>Fiche produit — Platinum</title>
</head><body data-v="auto">
<div id="hdr"></div>
<main>
<section class="p-hero" id="ph"><div class="wrap in">
 <div>
  <nav class="crumb"><a id="hm" href="index.html">Accueil</a><span>/</span><a href="produits.html">Produits</a><span>/</span><span id="cb"></span></nav>
  <h1 id="pn"></h1><div class="ar" id="pa"></div>
  <p class="lead" id="pl"></p>
  <div class="chips" id="pc" style="margin-bottom:24px"></div>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn g" href="revendeurs.html">Où l'acheter ?</a><a class="btn o" id="ask" href="#">Demander un conseil</a></div>
 </div>
 <div class="stage"><img id="pi" alt=""></div>
</div></section>
<section style="padding-top:clamp(40px,5vw,70px)"><div class="wrap pgrid">
 <div>
  <div class="panel rv"><h2>Le produit</h2><p id="pd" style="font-size:17px"></p></div>
  <div class="panel rv"><h2>Points clés</h2><ul id="pk"></ul></div>
  <div class="panel rv" id="tpan" hidden><h2>Données techniques</h2><table class="techt" id="tt"></table><p class="note">Données reprises de la communication Platinum. Se référer à l'étiquette.</p></div>
 </div>
 <div class="panel rv"><h2>En publication</h2><img id="cp" alt="" style="border-radius:14px" loading="lazy"><p class="note">Fiche technique PDF et fiche de données de sécurité : à ajouter.</p></div>
</div></section>
<section style="padding-top:0"><div class="wrap"><div class="shead"><h2>Dans la même gamme</h2></div><div class="rel" id="rel"></div></div></section>
</main>
<div id="ftr"></div>
<script src="data.js"></script><script src="core.js"></script>
<script>
const q=new URLSearchParams(location.search).get('p'),k=P[q]?q:'suten',p=P[k];
document.title='Platinum '+p.name+' — '+p.type;
document.getElementById('hm').href=HOME;document.getElementById('ask').href=HOME+'#contact';
document.getElementById('ph').style.setProperty('--c',p.c);
document.getElementById('cb').textContent=p.name;document.getElementById('pn').textContent=p.name;document.getElementById('pa').textContent=p.ar;
document.getElementById('pl').textContent=p.type+' · '+p.fmt+'. '+p.short;
document.getElementById('pc').innerHTML='<span>'+CAT[p.cat][0]+'</span>'+p.pts.slice(0,3).map(t=>'<span>'+t+'</span>').join('');
const pi=document.getElementById('pi');pi.src=p.img;pi.alt='Platinum '+p.name;
document.getElementById('pd').textContent=p.desc;
document.getElementById('pk').innerHTML=p.pts.map(t=>'<li>'+t+'</li>').join('');
if(p.tech){document.getElementById('tpan').hidden=false;document.getElementById('tt').innerHTML=p.tech.map(t=>'<tr><td>'+t[0]+'</td><td>'+t[1]+'</td></tr>').join('')}
const cp=document.getElementById('cp');cp.src=p.camp;cp.alt='Publication Platinum '+p.name;
const rel=ORDER.filter(x=>x!==k&&P[x].cat===p.cat).concat(ORDER.filter(x=>x!==k&&P[x].cat!==p.cat)).slice(0,4);
document.getElementById('rel').innerHTML=rel.map(x=>{const r=P[x];return '<a class="pc" href="produit.html?p='+x+'" style="--c:'+r.c+'"><div class="vis">'+pimg(x)+'</div><div class="tx"><small>'+r.type+'</small><h3>'+r.name+'</h3><span class="go">Voir →</span></div></a>'}).join('');
reveal();
</script>
<script src="https://radar-xi-flax.vercel.app/t.js" defer></script></body></html>
